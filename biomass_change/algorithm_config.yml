algorithm_description: Pulls ESA CCI aboveground biomass tiles from MAAP S3 (via maap-py) for two years and visualizes the apparent change in biomass over a region.
algorithm_name: biomass-change
algorithm_version: main
keywords: ogc, stac, biomass, raster
code_repository: https://github.com/marjo-luc/ogc-app-pack-examples.git
citation: https://github.com/marjo-luc/ogc-app-pack-examples.git
author: mlucas
contributor: mlucas
license: https://raw.githubusercontent.com/marjo-luc/ogc-app-pack-examples/refs/heads/main/LICENSE
release_notes: None
run_command: run.py
ram_min: 5 # mebibytes
cores_min: 1
outdir_max: 10 # mebibytes

inputs:
  - name: collection_id
    doc: STAC collection id of the annual AGB tiles
    label: Collection id
    type: string
    default: ESACCI_Biomass_L4_AGB_V4_100m
  - name: tile_id
    doc: ESA CCI tile id (e.g. S10W070)
    label: Tile id
    type: string
    default: S10W070
  - name: year_start
    doc: Earlier year to compare
    label: Start year
    type: int
    default: 2019
  - name: year_end
    doc: Later year to compare
    label: End year
    type: int
    default: 2020
  - name: asset_name
    doc: Name of the AGB asset to read
    label: Asset name
    type: string?
    default: estimates
  - name: bbox
    doc: Region to visualize as 'MINX MINY MAXX MAXY' in EPSG:4326
    label: Bounding box
    type: string
    default: -65 -12 -63 -10
  - name: output_file
    doc: Name of the output visualization
    label: Output filename
    type: string?
    default: biomass_change.png

outputs:
  - name: out
    type: Directory
