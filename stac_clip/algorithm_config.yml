algorithm_description: Searches the Earthdata CMR STAC catalog for a granule, downloads a raster asset over HTTP, clips it to a bounding box, and emits a new STAC Item describing the clipped output.
algorithm_name: stac-clip
algorithm_version: main
keywords: ogc, stac, raster
code_repository: https://github.com/marjo-luc/ogc-app-pack-examples.git
citation: https://github.com/marjo-luc/ogc-app-pack-examples.git
author: mlucas
contributor: mlucas
license: https://raw.githubusercontent.com/marjo-luc/ogc-app-pack-examples/refs/heads/main/LICENSE
release_notes: None
run_command: run.py
ram_min: 5 # mebibytes
cores_min: 1
outdir_max: 10 # mebibytes

inputs:
  - name: collection_id
    doc: STAC collection id containing the granule
    label: Collection id
    type: string
    default: HLSL30_2.0
  - name: granule_id
    doc: STAC item (granule) id to clip
    label: Granule id
    type: string
    default: HLS.L30.T10SEG.2023198T184546.v2.0
  - name: asset_name
    doc: Name of the raster asset to clip
    label: Asset name
    type: string?
    default: B04
  - name: bbox
    doc: Clip bounding box as 'MINX MINY MAXX MAXY' in EPSG:4326
    label: Bounding box
    type: string
    default: -122.55 37.70 -122.35 37.85
  - name: output_file
    doc: Name of the output COG
    label: Output filename
    type: string?
    default: clipped.tif

outputs:
  - name: out
    type: Directory
